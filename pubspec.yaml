name: jara_market
description: Jara Market Vendor App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  get: ^4.7.2
  overlay_kit: ^1.1.2
  shared_preferences: ^2.5.3
  http: ^1.4.0
  mime: ^2.0.0
  pull_to_refresh_flutter3: ^2.0.2
  flutter_svg: ^2.1.0
  circular_countdown_timer: ^0.2.4
  image_picker: ^1.1.2
  font_awesome_flutter: ^10.8.0
  url_launcher: ^6.3.1
  dropdown_search: ^6.0.2
  atomic_webview: ^0.0.7
  flutter_inappwebview: ^6.1.5
  launcher_name: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

  fonts:
    - family: Mont
      fonts:
        - asset: assets/fonts/Mont-ExtraLightDEMO.otf
        - asset: assets/fonts/Mont-HeavyDEMO.otf

#assets/images/1024.png

launcher_name:
  default: "JM Vendor"

flutter_launcher_icons:
  image_path: "assets/images/1024.png"
  android:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#004694"
    theme_color: "#004694"
  linux:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#004694"
    theme_color: "#004694"
  ios:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#004694"
    theme_color: "#004694"
    remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#004694"
    theme_color: "#004694"
  windows:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#004694"
    theme_color: "#004694"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#004694"
    theme_color: "#004694"
